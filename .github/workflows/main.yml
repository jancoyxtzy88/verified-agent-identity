name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo utama
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Clone Verified Agent Identity repo
        run: git clone https://github.com/jancoyxtzy88/verified-agent-identity.git

      - name: Install dependencies
        run: |
          cd verified-agent-identity/scripts
          npm install

      - name: Create Ethereum Identity
        run: node verified-agent-identity/scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          node verified-agent-identity/scripts/manualLinkHumanToAgent.js \
          --challenge '{"name":"jancoyxtzy88","description":"jancoyxtzy88 AI Agent"}'
